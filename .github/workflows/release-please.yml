name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5  # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    # Skipped until a PyPI trusted publisher exists for this repo: set the
    # repository variable PYPI_PUBLISHING to 'enabled' after configuring
    # pypi.org (owner flxk1, repo loomground-deontic, workflow
    # release-please.yml, environment pypi).
    if: ${{ needs.release.outputs.release-created == 'true' && vars.PYPI_PUBLISHING == 'enabled' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/loomground-deontic
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: install pinned release tooling
        run: python -m pip install "pytest==9.1.1" "jsonschema==4.26.0" "build==1.4.0" "reuse==6.2.0"
      - name: verify and build sdist and wheel once
        run: python tools/release_gate.py --dist-dir dist
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
